services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: planning
      POSTGRES_USER: planning
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlı olmalı}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - planning-db-data:/var/lib/postgresql/data

volumes:
  planning-db-data: